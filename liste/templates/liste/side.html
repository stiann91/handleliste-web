{% load static %}
<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handleliste</title>
  <link rel="stylesheet" href="{% static 'liste/liste.css' %}">
</head>
<body>
  <main class="wrap">
    <h1>🛒 Handleliste</h1>
    <p class="del">Del denne lenken med de du handler med:<br><code>{{ request.build_absolute_uri }}</code></p>
          <div class="sl-widget" id="sl-widget" data-liste-id="{{ lid }}">
            <div class="sl-inputrow">
              <div class="sl-input-wrap">
                <input
                  type="text"
                  id="sl-input"
                  class="sl-input"
                  placeholder="Legg til vare …"
                  autocomplete="off"
                />
                <ul id="sl-suggestions" class="sl-suggestions" hidden></ul>
              </div>
              <button id="sl-add" class="sl-btn sl-btn-add" type="button">Legg til</button>
            </div>

            <div id="sl-scanner" style="max-width:360px;" hidden></div>

            <ul id="sl-list" class="sl-list"></ul>

            <p id="sl-empty" class="sl-empty">Handlelisten er tom. Skriv noe over for å legge til.</p>

            <div class="sl-secondary-actions">
              <button id="sl-sort" class="sl-btn sl-btn-ghost sl-btn-sort" type="button">Sorter etter butikk</button>
              <button id="sl-scan" class="sl-btn sl-btn-ghost" type="button">📷 Skann strekkode</button>
            </div>

            <div class="sl-actions">
              <button id="sl-copy" class="sl-btn sl-btn-ghost" type="button">Kopier til utklippstavle</button>
              <button id="sl-clear" class="sl-btn sl-btn-danger" type="button">Tøm listen</button>
            </div>

            <div id="sl-turer" class="sl-turer-section" hidden>
              <p class="sl-turer-tittel">Tidligere handleturer</p>
              <ul id="sl-turer-list" class="sl-turer-list"></ul>
            </div>

            <div id="sl-toast" class="sl-toast" role="status" aria-live="polite"></div>
          </div>
  </main>
  <footer class="fot">Aktive enheter siste 24 timer: {{ aktive_siste_dogn }}</footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="{% static 'liste/liste.js' %}"></script>
</body>
</html>
