{% load static %}
<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finnes ikke</title>
  <link rel="stylesheet" href="{% static 'liste/liste.css' %}">
  <link rel="icon" href="{% static 'liste/icons/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'liste/icons/favicon-16.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'liste/icons/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="48x48" href="{% static 'liste/icons/favicon-48.png' %}">
  <link rel="apple-touch-icon" href="{% static 'liste/icons/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'liste/icons/site.webmanifest' %}">
  <meta name="theme-color" content="#6b4a35">
  <script>
    (function () {
      try {
        if (localStorage.getItem("handleliste_id") === "{{ lid }}") {
          localStorage.removeItem("handleliste_id");
        }
      } catch (e) {
        // localStorage utilgjengelig
      }
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <h1>Listen finnes ikke</h1>
    <p>Lenken kan være feil, eller listen er slettet etter 7 dager uten bruk.</p>
    <p><a class="knapp-lenke" href="/">Lag en ny liste</a></p>
  </main>
</body>
</html>
