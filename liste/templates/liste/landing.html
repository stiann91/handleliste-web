{% load static %}
<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handleliste</title>
  <link rel="stylesheet" href="{% static 'liste/liste.css' %}">
  <link rel="icon" href="{% static 'liste/icons/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'liste/icons/favicon-16.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'liste/icons/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="48x48" href="{% static 'liste/icons/favicon-48.png' %}">
  <link rel="apple-touch-icon" href="{% static 'liste/icons/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'liste/icons/site.webmanifest' %}">
  <meta name="theme-color" content="#6b4a35">
  <script>
    // Kjøres så tidlig som mulig for å unngå "blink" av landing-innholdet
    // for brukere som allerede har en liste.
    (function () {
      try {
        var lagretId = localStorage.getItem("handleliste_id");
        if (lagretId) {
          window.location.replace("/liste/" + lagretId + "/");
        }
      } catch (e) {
        // localStorage utilgjengelig – vis vanlig landing-side
      }
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <h1>🛒 Handleliste</h1>
    <p>Lag en liste og del lenken med dem du handler med.</p>
    <form method="post" action="{% url 'ny' %}">
      {% csrf_token %}
      <button class="knapp" type="submit">Ny handleliste</button>
    </form>
  </main>
</body>
</html>
